<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="MiR250 otonom mobil robot için CE ve siber güvenlik incelemesi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#121b30"/>
      <stop offset="0.5" stop-color="#1b2f48"/>
      <stop offset="1" stop-color="#1a8f8a"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d3c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d3c8" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="18" fill="url(#dots)"/>
  <circle cx="1130" cy="30" r="150" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="-20" cy="360" r="120" fill="#ffffff" fill-opacity="0.04"/>

  <!-- text -->
  <text x="60" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#9fe6df">SAFETY 4.0 · CE · SİBER GÜVENLİK</text>
  <text x="58" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" fill="#ffffff">MiR250</text>
  <text x="60" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#e8f1f7">Otonom mobil robot için</text>
  <text x="60" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">CE ve siber güvenlik incelemesi</text>

  <!-- chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="60" y="252" width="168" height="32" rx="16" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.5"/>
    <text x="144" y="273" text-anchor="middle" fill="#ffffff">LAB 1–4 tamamlandı</text>
    <rect x="240" y="252" width="116" height="32" rx="16" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.5"/>
    <text x="298" y="273" text-anchor="middle" fill="#ffffff">IEC 62443</text>
    <rect x="368" y="252" width="196" height="32" rx="16" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.5"/>
    <text x="466" y="273" text-anchor="middle" fill="#ffffff">CRA · Makine Tüzüğü</text>
  </g>

  <!-- floor -->
  <line x1="690" y1="292" x2="1170" y2="292" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- protective field -->
  <polygon points="1068,238 1172,170 1172,288" fill="url(#field)" stroke="#34d3c8" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- cargo -->
  <rect x="826" y="142" width="170" height="64" rx="7" fill="#e8a317"/>
  <rect x="826" y="142" width="170" height="64" rx="7" fill="none" stroke="#b97f0a" stroke-width="2"/>
  <line x1="883" y1="142" x2="883" y2="206" stroke="#b97f0a" stroke-width="2"/>
  <line x1="939" y1="142" x2="939" y2="206" stroke="#b97f0a" stroke-width="2"/>

  <!-- wheels (under the body, only the bottom peeks out) -->
  <circle cx="820" cy="270" r="18" fill="#1f2a44"/>
  <circle cx="1010" cy="270" r="18" fill="#1f2a44"/>

  <!-- robot body -->
  <rect x="760" y="198" width="312" height="16" rx="8" fill="#5b7186"/>
  <rect x="760" y="206" width="312" height="56" rx="14" fill="#c9d6e3"/>
  <rect x="780" y="226" width="150" height="8" rx="4" fill="#9db0c2"/>
  <!-- status lights -->
  <circle cx="1052" cy="246" r="6" fill="#34d3c8"/>
  <circle cx="780" cy="246" r="6" fill="#e8a317"/>
  <!-- lidar scanner -->
  <rect x="1056" y="226" width="20" height="16" rx="4" fill="#b0281e"/>
  <rect x="1066" y="230" width="10" height="8" rx="2" fill="#ffffff" fill-opacity="0.85"/>


  <!-- person -->
  <circle cx="1138" cy="226" r="10" fill="#ffffff"/>
  <rect x="1129" y="238" width="18" height="34" rx="8" fill="#ffffff"/>
  <line x1="1134" y1="270" x2="1131" y2="292" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="1143" y1="270" x2="1146" y2="292" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- stop badge -->
  <circle cx="1100" cy="150" r="20" fill="#b0281e" stroke="#ffffff" stroke-width="2"/>
  <text x="1100" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">!</text>
  <text x="1100" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.9">DUR</text>
</svg>
