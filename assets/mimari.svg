<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="MiR250: üretim yolu, emniyet yolu ve aralarındaki dijital kesişim noktası">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5b6878"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="358" rx="16" fill="#ffffff" stroke="#cfd8e3" stroke-width="2"/>

  <text x="30" y="40" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1f2a44">MiR250: iki kontrol yolu ve dijital kesişim noktası</text>

  <!-- normal path -->
  <text x="30" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#1f2a44">NORMAL KONTROL YOLU · üretim</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="30" y="90" width="170" height="54" rx="8" fill="#d6e4f0"/>
    <text x="115" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a44">3D kamera / harita</text>
    <line x1="204" y1="117" x2="236" y2="117" stroke="#5b6878" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="240" y="90" width="190" height="54" rx="8" fill="#1a9e96"/>
    <text x="335" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Robot bilgisayarı</text>
    <text x="335" y="132" text-anchor="middle" font-size="11" fill="#ffffff">ROS · rota ve hız kararı</text>
    <line x1="434" y1="117" x2="466" y2="117" stroke="#5b6878" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="470" y="90" width="170" height="54" rx="8" fill="#d6e4f0"/>
    <text x="555" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a44">Tekerlek motorları</text>
    <rect x="690" y="90" width="180" height="54" rx="8" fill="#e3582f"/>
    <text x="780" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Wi-Fi / Web arayüzü</text>
    <text x="780" y="132" text-anchor="middle" font-size="11" fill="#ffffff">uzaktan erişim · MiR Fleet</text>
  </g>

  <!-- digital crossing -->
  <path d="M780 144 V190 H335 V222" fill="none" stroke="#e8a317" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="470" y="177" width="190" height="26" rx="13" fill="#e8a317"/>
  <text x="565" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f2a44">dijital kesişim noktası</text>

  <!-- safety path -->
  <text x="30" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#b0281e">SAFETY YOLU · koruma · AYRI</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="30" y="226" width="170" height="60" rx="8" fill="#eef2f6" stroke="#cfd8e3"/>
    <text x="115" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a44">2 × nanoScan3</text>
    <text x="115" y="271" text-anchor="middle" font-size="11" fill="#1f2a44">+ acil stop butonları</text>
    <line x1="204" y1="256" x2="236" y2="256" stroke="#5b6878" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="240" y="226" width="190" height="60" rx="8" fill="#b0281e"/>
    <text x="335" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">SICK emniyet kontrolcüsü</text>
    <text x="335" y="271" text-anchor="middle" font-size="11" fill="#ffffff">Safety PLC · çift kanallı</text>
    <line x1="434" y1="256" x2="466" y2="256" stroke="#5b6878" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="470" y="226" width="170" height="60" rx="8" fill="#eef2f6" stroke="#cfd8e3"/>
    <text x="555" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a44">Motor güç kesme</text>
    <text x="555" y="271" text-anchor="middle" font-size="11" fill="#1f2a44">+ fren</text>
    <line x1="644" y1="256" x2="676" y2="256" stroke="#5b6878" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="680" y="226" width="190" height="60" rx="8" fill="#1e2d4a"/>
    <text x="775" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Safe State</text>
  </g>

  <text x="30" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5b6878">Sarı kesikli çizgi: Wi-Fi ve web arayüzü üzerinden emniyet ayarlarına ulaşabilen yol. LAB 4'te bu yol kapatılır.</text>
</svg>
